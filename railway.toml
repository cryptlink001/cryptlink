[build]
builder = "DOCKERFILE"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/api/health"
healthcheckTimeout = 300
healthcheckInterval = 15

[[services]]
name = "web"

[services.ports]
port = 8080

[services.concurrency]
type = "connections"
hard_limit = 25
soft_limit = 20

[services.env]
PORT = "8080"
SPRING_PROFILES_ACTIVE = "railway"
JAVA_OPTS = "-Xmx512m -Xms256m"
