[build]
builder = "NIXPACKS"

[deploy]
startCommand = "cd backend && java -jar target/cryptlink-0.0.1-SNAPSHOT.jar"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/api/health"
healthcheckTimeout = 100
healthcheckInterval = 5

[phases.setup]
nixPkgs = ["jdk17", "maven"]

[phases.build]
cmds = ["cd backend && mvn clean package -DskipTests"]

[[services]]
name = "web"

[services.ports]
port = 8080

[services.concurrency]
type = "connections"
hard_limit = 25
soft_limit = 20

[services.env]
PORT = "8080"
SPRING_PROFILES_ACTIVE = "prod"
