# Railway-specific configuration
server.port=${PORT:8080}
server.servlet.context-path=/api

# Database Configuration (from Railway environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Redis Configuration (from Railway environment variables)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD}
spring.data.redis.timeout=2000ms

# JWT Configuration (from Railway environment variables)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS Configuration (from Railway environment variables)
spring.web.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,https://*.railway.app}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# WebSocket Configuration (from Railway environment variables)
websocket.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,https://*.railway.app}

# Storage Configuration (from Railway environment variables)
cloud.storage.provider=${CLOUD_STORAGE_PROVIDER:local}
cloud.storage.supabase.url=${CLOUD_STORAGE_SUPABASE_URL:}
cloud.storage.supabase.key=${CLOUD_STORAGE_SUPABASE_KEY:}
cloud.storage.bucket=${CLOUD_STORAGE_BUCKET:cryptlink-media}

# Logging Configuration
logging.level.com.cryptlink=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# Health Check
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# Railway-specific optimizations
spring.jmx.enabled=false
spring.output.ansi.enabled=never
